<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工照片批量处理工具</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "@imgly/background-removal": "https://esm.sh/@imgly/background-removal@1.7.0"
  }
}
</script>
</head>
<body>

<!-- ====== 页头 ====== -->
<header class="header">
  <h1>📸 员工照片批量处理</h1>
  <p class="subtitle">上传原图 → AI 智能抠图 → 美白磨皮 → 工牌照 + 座位牌</p>
</header>

<main class="container">

  <!-- ====== 上传区 ====== -->
  <section class="upload-section" id="uploadSection">
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📁</div>
      <div class="upload-text">
        <strong>点击上传</strong> 或拖拽照片到此处
      </div>
      <div class="upload-hint">支持 JPG / PNG / WebP / HEIC，可多选</div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" hidden>
  </section>

  <!-- ====== 文件列表 ====== -->
  <section class="file-list-section" id="fileListSection" style="display:none">
    <div class="section-header">
      <h2>待处理照片</h2>
      <span class="badge" id="fileCount">0 张</span>
      <button class="btn btn-sm btn-outline" id="clearFiles">清空</button>
    </div>
    <div class="file-list" id="fileList"></div>
  </section>

  <!-- ====== 设置面板 ====== -->
  <section class="settings-section">
    <details class="settings-panel">
      <summary class="settings-trigger">⚙️ 输出参数设置</summary>
      <div class="settings-grid">
        <div class="setting-item">
          <label>工牌照上边距</label>
          <div class="range-row">
            <input type="range" id="badgeTopMargin" min="5" max="20" value="11" step="0.5">
            <span class="range-val" id="badgeTopMarginVal">11%</span>
          </div>
          <span class="setting-desc">头顶留白，越大头像越小</span>
        </div>
        <div class="setting-item">
          <label>座位牌上边距</label>
          <div class="range-row">
            <input type="range" id="plateTopMargin" min="2" max="15" value="6" step="0.5">
            <span class="range-val" id="plateTopMarginVal">6%</span>
          </div>
          <span class="setting-desc">更紧凑，展示更多身体</span>
        </div>
        <div class="setting-item">
          <label>磨皮强度</label>
          <div class="range-row">
            <input type="range" id="smoothStrength" min="0" max="60" value="30" step="5">
            <span class="range-val" id="smoothStrengthVal">30%</span>
          </div>
          <span class="setting-desc">0=不磨皮，60=强磨皮</span>
        </div>
        <div class="setting-item">
          <label>美白提亮</label>
          <div class="range-row">
            <input type="range" id="brightness" min="0" max="15" value="6" step="1">
            <span class="range-val" id="brightnessVal">6%</span>
          </div>
          <span class="setting-desc">数值越大肤色越亮</span>
        </div>
      </div>
    </details>
  </section>

  <!-- ====== 操作按钮 ====== -->
  <div class="action-bar">
    <button class="btn btn-primary btn-lg" id="processBtn" disabled>
      🚀 开始处理
    </button>
    <button class="btn btn-outline btn-lg" id="downloadZipBtn" style="display:none">
      📦 下载全部 (ZIP)
    </button>
  </div>

  <!-- ====== AI 引擎状态 ====== -->
  <div class="engine-status" id="engineStatus">
    <span class="status-dot loading"></span>
    <span>AI 抠图引擎加载中...</span>
    <span class="status-hint">首次加载需下载模型 (~4MB)，请耐心等待</span>
  </div>

  <!-- ====== 处理进度 ====== -->
  <section class="progress-section" id="progressSection" style="display:none">
    <h2>处理进度</h2>
    <div class="progress-list" id="progressList"></div>
  </section>

  <!-- ====== 处理结果 ====== -->
  <section class="results-section" id="resultsSection" style="display:none">
    <h2>处理结果</h2>
    <div class="results-grid" id="resultsGrid"></div>
  </section>

</main>

<!-- ====== 页脚 ====== -->
<footer class="footer">
  <p>🔒 所有照片均在本地浏览器处理，不上传任何服务器</p>
  <p>Powered by <a href="https://github.com/imgly/background-removal-js" target="_blank">IMG.LY Background Removal</a></p>
</footer>

<!-- JSZip CDN -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- App -->
<script type="module" src="app.js"></script>
</body>
</html>
